<Project Sdk="Microsoft.NET.Sdk">
  <PropertyGroup>
    <TargetFrameworks>net11.0-windows</TargetFrameworks>
    <OutputType>Library</OutputType>
    <GenerateAssemblyInfo>false</GenerateAssemblyInfo>
    <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
    <ImportWindowsDesktopTargets>true</ImportWindowsDesktopTargets>
    <UseWPF>true</UseWPF>
    <UseWindowsForms>true</UseWindowsForms>
    <PaintNetInstallDir Condition="'$(PaintNetInstallDir)' == ''">C:\Program Files\paint.net</PaintNetInstallDir>
  </PropertyGroup>
  <ItemGroup>
    <Compile Remove="3rdParty\**" />
    <Compile Remove="ARM64\**" />
    <Compile Remove="DdsFileTypePlusIO\**" />
    <Compile Remove="Debug\**" />
    <Compile Remove="Release\**" />
    <Compile Remove="x64\**" />
    <EmbeddedResource Remove="3rdParty\**" />
    <EmbeddedResource Remove="ARM64\**" />
    <EmbeddedResource Remove="DdsFileTypePlusIO\**" />
    <EmbeddedResource Remove="Debug\**" />
    <EmbeddedResource Remove="Release\**" />
    <EmbeddedResource Remove="x64\**" />
    <None Remove="3rdParty\**" />
    <None Remove="ARM64\**" />
    <None Remove="DdsFileTypePlusIO\**" />
    <None Remove="Debug\**" />
    <None Remove="Release\**" />
    <None Remove="x64\**" />
  </ItemGroup>
  <ItemGroup>
    <Reference Include="PaintDotNet.Base">
      <HintPath>$(PaintNetInstallDir)\PaintDotNet.Base.dll</HintPath>
    </Reference>
    <Reference Include="PaintDotNet.ComponentModel">
      <HintPath>$(PaintNetInstallDir)\PaintDotNet.ComponentModel.dll</HintPath>
    </Reference>
    <Reference Include="PaintDotNet.Core">
      <HintPath>$(PaintNetInstallDir)\PaintDotNet.Core.dll</HintPath>
    </Reference>
    <Reference Include="PaintDotNet.Data">
      <HintPath>$(PaintNetInstallDir)\PaintDotNet.Data.dll</HintPath>
    </Reference>
    <Reference Include="PaintDotNet.Fundamentals">
      <HintPath>$(PaintNetInstallDir)\PaintDotNet.Fundamentals.dll</HintPath>
    </Reference>
    <Reference Include="PaintDotNet.Primitives">
      <HintPath>$(PaintNetInstallDir)\PaintDotNet.Primitives.dll</HintPath>
    </Reference>
    <Reference Include="PaintDotNet.PropertySystem">
      <HintPath>$(PaintNetInstallDir)\PaintDotNet.PropertySystem.dll</HintPath>
    </Reference>
    <Reference Include="PaintDotNet.Windows">
      <HintPath>$(PaintNetInstallDir)\PaintDotNet.Windows.dll</HintPath>
    </Reference>
  </ItemGroup>
  <ItemGroup>
    <Compile Update="Properties\Resources.Designer.cs">
      <AutoGen>True</AutoGen>
      <DesignTime>True</DesignTime>
      <DependentUpon>Resources.resx</DependentUpon>
    </Compile>
  </ItemGroup>
  <ItemGroup>
    <EmbeddedResource Update="Properties\Resources.resx">
      <Generator>ResXFileCodeGenerator</Generator>
      <LastGenOutput>Resources.Designer.cs</LastGenOutput>
    </EmbeddedResource>
  </ItemGroup>
  <Target Name="PostBuild" AfterTargets="PostBuildEvent" Condition="'$(PaintNetFileTypesDir)' != ''">
    <Exec Command="if not exist &quot;$(PaintNetFileTypesDir)&quot; mkdir &quot;$(PaintNetFileTypesDir)&quot;&#xD;&#xA;copy /y &quot;$(TargetPath)&quot; &quot;$(PaintNetFileTypesDir)\&quot;" />
  </Target>
</Project>
